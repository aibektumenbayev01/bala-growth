version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: bala-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bala_growth
    ports:
      - "5433:5432"
    volumes:
      - bala_pgdata:/var/lib/postgresql/data

volumes:
  bala_pgdata: